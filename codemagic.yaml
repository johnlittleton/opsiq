workflows:
  ios-testflight:
    name: iOS TestFlight (OpsIQ Mobile)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodemagicAppStoreConnect

    environment:
      ios_signing:
        provisioning_profiles:
          - opsiq_ios_appstore_profile
        certificates:
          - opsiq_ios_distribution
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build:react

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install iOS pods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          RAW_BUILD_ID="${CM_BUILD_ID:-}"
          BUILD_NUMBER="${RAW_BUILD_ID//[^0-9]/}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$(date +%s)"
          fi
          echo "Using build number: $BUILD_NUMBER"
          shopt -s nullglob
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MATCHED_PROFILE_NAME=""
          PROFILE_FILES=("$PROFILE_DIR"/*.mobileprovision)

          if [[ ${#PROFILE_FILES[@]} -eq 0 ]]; then
            echo "No provisioning profiles found in: $PROFILE_DIR"
            echo "Ensure signing profiles are fetched before archive."
            exit 1
          fi

          for profile in "${PROFILE_FILES[@]}"; do
            security cms -D -i "$profile" > /tmp/profile.plist
            app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist 2>/dev/null || true)
            if [[ "$app_id" == *".com.johnlittleton.opsiq.mobile" ]]; then
              MATCHED_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
              break
            fi
          done

          if [[ -z "$MATCHED_PROFILE_NAME" ]]; then
            echo "No provisioning profile found for com.johnlittleton.opsiq.mobile"
            exit 1
          fi

          echo "Using provisioning profile: $MATCHED_PROFILE_NAME"

          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>ZL366VWFY8</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.johnlittleton.opsiq.mobile</key>
              <string>$MATCHED_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          if ! xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/archive/OpsIQMobile.xcarchive \
            archive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=ZL366VWFY8 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$MATCHED_PROFILE_NAME" \
            2>&1 | tee /tmp/opsiq-archive.log; then
            echo "Archive failed. Key errors:"
            grep -E "error:|No profile|requires a provisioning profile|ARCHIVE FAILED|Code Signing Error" /tmp/opsiq-archive.log | tail -n 30 || true
            exit 1
          fi

          if ! xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/OpsIQMobile.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist \
            2>&1 | tee /tmp/opsiq-export.log; then
            echo "Export failed. Key errors:"
            grep -E "error:|EXPORT FAILED|No profile|provision|signing" /tmp/opsiq-export.log | tail -n 30 || true
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
