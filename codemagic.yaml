workflows:
  ios-testflight:
    name: iOS TestFlight (OpsIQ Mobile)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodemagicAppStoreConnect

    environment:
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build:react

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install iOS pods
        script: |
          cd ios/App
          pod install

      - name: Set up keychain and fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.slingshot.opsiq.mobile --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal
