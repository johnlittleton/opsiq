workflows:
  ios-testflight:
    name: iOS TestFlight (OpsIQ Mobile)
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CodemagicAppStoreConnect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.slingshot.opsiq.mobile
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        IOS_APP_VERSION: 1.0.85
      node: 20
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web app
        script: |
          npm run build:react

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Install iOS pods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing settings
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          APP_VERSION="${IOS_APP_VERSION}"
          RAW_BUILD_ID="${CM_BUILD_ID:-}"
          BUILD_NUMBER="${RAW_BUILD_ID//[^0-9]/}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            BUILD_NUMBER="$(date +%s)"
          fi
          echo "Using marketing version: $APP_VERSION"
          echo "Using build number: $BUILD_NUMBER"
          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>ZL366VWFY8</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.slingshot.opsiq.mobile</key>
              <string>OpsIQ Mobile App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

          if ! xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/archive/OpsIQMobile.xcarchive \
            archive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=ZL366VWFY8 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="OpsIQ Mobile App Store" \
            2>&1 | tee /tmp/opsiq-archive.log; then
            echo "Archive failed. Key errors:"
            grep -E "error:|No profile|requires a provisioning profile|ARCHIVE FAILED|Code Signing Error" /tmp/opsiq-archive.log | tail -n 30 || true
            exit 1
          fi

          if ! xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/OpsIQMobile.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist \
            2>&1 | tee /tmp/opsiq-export.log; then
            echo "Export failed. Key errors:"
            grep -E "error:|EXPORT FAILED|No profile|provision|signing" /tmp/opsiq-export.log | tail -n 30 || true
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
