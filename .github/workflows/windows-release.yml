name: Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Validate updates repo token
        shell: bash
        run: |
          if [ -z "${{ secrets.UPDATES_REPO_TOKEN }}" ]; then
            echo "UPDATES_REPO_TOKEN is not set. Add a PAT secret with repo write access to johnlittleton/opsiq-updates."
            exit 1
          fi

      - name: Upload release artifacts (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.app_version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          owner: johnlittleton
          repo: opsiq-updates
          tag: ${{ steps.app_version.outputs.tag }}
          name: OpsIQ ${{ steps.app_version.outputs.version }}
          generateReleaseNotes: true
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          updateOnlyUnreleased: false
          artifacts: "release/*"
          token: ${{ secrets.UPDATES_REPO_TOKEN }}